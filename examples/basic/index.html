<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CE2 — Basic Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080810;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px;
      gap: 20px;
    }

    header { text-align: center; }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: .12em; color: #94a3b8; text-transform: uppercase; }
    header p  { font-size: .75rem; color: #334155; margin-top: 3px; }

    /* ── Main layout ──────────────────────────────────────────────────────── */
    .demo-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      width: 100%;
      max-width: 900px;
    }

    /* ── Player side ──────────────────────────────────────────────────────── */
    .player-side {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    #player-wrap {
      width: 280px;
      height: 498px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.7);
    }
    #player-container { width: 100%; height: 100%; }

    #controls { width: 280px; display: flex; flex-direction: column; gap: 10px; }

    #progress-wrap {
      height: 4px; background: #1a1a2e; border-radius: 2px; cursor: pointer;
    }
    #progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      border-radius: 2px;
      pointer-events: none;
    }

    .btn-row { display: flex; align-items: center; gap: 8px; }

    button {
      background: #161625; border: 1px solid #252540; color: #cbd5e1;
      border-radius: 7px; padding: 7px 14px; font-size: .8rem; cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    button:hover  { background: #1e1e35; border-color: #3f3f70; }
    button:active { transform: scale(.97); }

    #btn-play {
      min-width: 80px; background: #4338ca; border-color: #6366f1; font-weight: 600; color: #fff;
    }
    #btn-play:hover { background: #3730a3; }

    .time-label { font-size: .72rem; color: #475569; flex: 1; text-align: right; font-variant-numeric: tabular-nums; }

    #moment-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .moment-pill {
      font-size: .68rem; padding: 3px 10px; border-radius: 20px;
      background: #161625; border: 1px solid #252540; color: #475569; cursor: pointer;
    }
    .moment-pill.active  { background: rgba(99,102,241,.15); border-color: #6366f1; color: #a5b4fc; }
    .moment-pill:hover   { border-color: #4f4f80; color: #94a3b8; }

    /* ── JSON side ────────────────────────────────────────────────────────── */
    .json-side {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1px solid #1e1e35;
      border-radius: 12px;
      overflow: hidden;
      max-height: 560px;
    }

    .json-header {
      display: flex;
      align-items: center;
      gap: 0;
      background: #0f0f1e;
      border-bottom: 1px solid #1e1e35;
      padding: 0 10px;
    }

    .json-tab {
      font-size: .72rem; padding: 9px 14px; cursor: pointer;
      color: #475569; border: none; background: none; border-bottom: 2px solid transparent;
      transition: color .12s, border-color .12s;
    }
    .json-tab:hover  { color: #94a3b8; }
    .json-tab.active { color: #a5b4fc; border-bottom-color: #6366f1; }

    .json-copy {
      margin-left: auto; font-size: .7rem; padding: 4px 10px;
      background: #1a1a30; border-color: #2a2a50; color: #64748b; border-radius: 5px;
    }
    .json-copy:hover { color: #94a3b8; }

    #json-content {
      background: #0a0a18;
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: .7rem;
      line-height: 1.6;
      color: #8892aa;
      white-space: pre;
    }

    /* JSON syntax colors */
    .jk  { color: #7c9ae8; }   /* key      */
    .js  { color: #98c379; }   /* string   */
    .ji  { color: #e5c07b; }   /* number   */
    .jb  { color: #c678dd; }   /* boolean  */
    .jn  { color: #56b6c2; }   /* null     */

    /* ── Status ───────────────────────────────────────────────────────────── */
    #status { font-size: .7rem; color: #22c55e; text-align: center; }
    #status.error { color: #ef4444; }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 680px) {
      .demo-layout { flex-direction: column; align-items: center; }
      .json-side   { width: 100%; max-width: 420px; max-height: 340px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>CE2 Basic Demo</h1>
    <p>@ce2/browser — DOM renderer</p>
  </header>

  <div class="demo-layout">
    <!-- Player -->
    <div class="player-side">
      <div id="player-wrap">
        <div id="player-container"></div>
      </div>
      <div id="controls">
        <div id="progress-wrap"><div id="progress-fill"></div></div>
        <div class="btn-row">
          <button id="btn-play">▶ Play</button>
          <button id="btn-stop">■ Stop</button>
          <span class="time-label" id="time-label">0.0s / 12.0s</span>
        </div>
        <div id="moment-row"></div>
      </div>
    </div>

    <!-- JSON panel -->
    <div class="json-side">
      <div class="json-header">
        <button class="json-tab active" id="json-tab-moment">Current moment</button>
        <button class="json-tab" id="json-tab-full">Full composition</button>
        <button class="json-copy" id="json-copy">Copy</button>
      </div>
      <pre id="json-content"></pre>
    </div>
  </div>

  <div id="status"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
